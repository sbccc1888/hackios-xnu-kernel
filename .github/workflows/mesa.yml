name: mesa

# Builds the mesa libraries HackiOS draws with, on a stock Ubuntu runner.
#
# Why CI: the build needs theos cctools, an iOS 16.5 SDK, and a mesa tree long
# enough to hold every object -- about 3 GB. The machine this was written on had
# 3.5 GB free, which is not enough, and a runner has the SDK one clone away.
#
# What comes out:
#   libOSMesa.8.dylib      the GL ES implementation the window server draws
#                          through; userland/src/eagl.c stands in front of it and
#                          looks its entry points up by name.
#   libredwoodair.dylib    AIR (Metal IR) -> NIR -> ir3, the compute path: it is
#                          what lets a Metal shader be compiled for the Adreno.
#
# Every number comes from this repository -- the version and checksum in
# tools/mk-mesa.sh, the patches in tools/mesa/, the AIR frontend in tools/mesa/air/.
# Nothing is fetched from Apple except the SDK, which is public.

on:
  push:
    branches: [main, chiron, 'chiron-*']
    paths:
      - 'tools/mesa/**'
      - 'tools/mk-mesa.sh'
      - '.github/workflows/mesa.yml'
  pull_request:
    paths:
      - 'tools/mesa/**'
      - 'tools/mk-mesa.sh'
      - '.github/workflows/mesa.yml'
  workflow_dispatch:
    inputs:
      air:
        description: 'also build libredwoodair.dylib (the compute path)'
        type: boolean
        default: true

concurrency:
  group: mesa-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  SDK_REPO: https://github.com/theos/sdks.git
  TOOLCHAIN_URL: https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz

jobs:
  mesa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git curl tar xz-utils \
            python3 python3-venv ninja-build pkg-config \
            llvm-18 llvm-18-tools

      - name: theos + the iOS 16.5 SDK + cctools
        run: |
          # The SDK and the Linux cctools are what make a Mach-O arm64 target
          # possible; stock gcc cannot produce one.
          git clone -q --depth 1 "$SDK_REPO" /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "  SDK: $(du -sh "$THEOS/sdks/iPhoneOS16.5.sdk" | cut -f1)"

          mkdir -p "$THEOS/toolchain"
          curl -sSL --fail --retry 3 "$TOOLCHAIN_URL" | tar -xJ -C "$THEOS/toolchain"

      - name: The XNU compiler wrapper
        run: |
          # The SDK ships libc++.tbd and libz.tbd; objects built against them need
          # them named at link time, which is what the rest of this step sets up.
          # mk-mesa.sh compiles with xnu-deps/host/bin/xnu-clang: a wrapper that
          # forces -target arm64-apple-ios and links with cctools ld64. setup.sh
          # generates it as part of building the kernel, which is not what this
          # job does, so recreate just this piece -- and prove it produces a
          # Mach-O object before going further.
          mkdir -p xnu-deps/host/bin xnu-deps/hostinc
          export SDKROOT="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDKROOT" || { echo "no SDK at $SDKROOT"; exit 1; }
          cat > xnu-deps/host/bin/xnu-clang <<'WRAP'
          #!/bin/bash
          HB="$(cd "$(dirname "$0")" && pwd)"
          SDKROOT="${SDKROOT:-$HB/../../../theos/sdks/iPhoneOS16.5.sdk}"
          case "$(basename "$0")" in *++) drv=clang++; extra=(-fno-use-cxa-atexit);; *) drv=clang; extra=();; esac
          args=()
          for a in "$@"; do
            case "$a" in
              -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang) ;;
              -fapple-kext-vtable-verify|-Wno-vla-cxx-extension) ;;
              -Werror|-Werror=*|-Weverything|-pedantic-errors) ;;
              *) args+=("$a");;
            esac
          done
          # Linking needs the SDK's stubs for libc++ and zlib. They are named by
          # absolute path rather than -lc++/-lz: the .tbd files are text stubs that
          # ld64 reads directly, and a path needs no search order to resolve.
          LIBCXX="$SDKROOT/usr/lib/libc++.tbd"
          LIBZ="$SDKROOT/usr/lib/libz.tbd"
          for f in "$LIBCXX" "$LIBZ"; do
            [ -f "$f" ] || { echo "missing stub: $f" >&2; exit 1; }
          done
          exec clang -include "$HB/../../hostinc/xnu_clang_compat.h" \
            -target arm64-apple-ios${XNU_SDK_VERSION:-16.5} --ld-path="$HB/ld64" \
            "$LIBCXX" "$LIBZ" \
            -w "${extra[@]}" "${args[@]}"
          WRAP
          chmod +x xnu-deps/host/bin/xnu-clang
          ln -sf xnu-clang xnu-deps/host/bin/xnu-clang++
          echo '--- the wrapper as written ---'
          sed -n '1,25p' xnu-deps/host/bin/xnu-clang
          # xnu-deps/setup.sh:123 does `link "$CCTOOLS/ld" host/bin/ld64`: the file
          # in cctools is named `ld`, and `ld64` is the name it is given here.
          # Pointing --ld-path at .../bin/ld64 in the toolchain was a dangling path,
          # which clang rejects with "invalid linker name".
          CCTOOLS="$THEOS/toolchain/linux/iphone/bin"
          test -x "$CCTOOLS/ld" || { echo "no linker at $CCTOOLS/ld"; ls -l "$CCTOOLS" | head; exit 1; }
          ln -sf "$CCTOOLS/ld" xnu-deps/host/bin/ld64
          echo "linker: $(readlink -f xnu-deps/host/bin/ld64) -> $($PWD/xnu-deps/host/bin/ld64 -v 2>&1 | head -1)"

          cat > xnu-deps/hostinc/xnu_clang_compat.h <<'HDR'
          #ifndef XNU_CLANG_COMPAT_H
          #define XNU_CLANG_COMPAT_H
          #endif
          HDR

          printf 'int main(void){return 0;}\n' > /tmp/t.c
          XNU_SDK_VERSION=16.5 xnu-deps/host/bin/xnu-clang \
            -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -c /tmp/t.c -o /tmp/t.o
          file /tmp/t.o
          file /tmp/t.o | grep -q 'Mach-O' || { echo 'the wrapper does not produce Mach-O'; exit 1; }

          # Compiling proves the frontend; meson also probes the *linker*, and that
          # is what failed next. Link one too, so a broken ld64 says so here rather
          # than inside meson's linker detection.
          XNU_SDK_VERSION=16.5 xnu-deps/host/bin/xnu-clang \
            -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/t.c -o /tmp/t.bin \
            || { echo 'the wrapper cannot link'; exit 1; }
          file /tmp/t.bin | grep -q 'Mach-O' || { echo 'the linked output is not Mach-O'; exit 1; }
          echo "linked: $(file -b /tmp/t.bin)"

          # A C++ program that uses what mesa's objects use. Run with output kept:
          # the previous version exited without printing either of its two messages,
          # so the failure was inside something that swallowed its own stderr.
          cat > /tmp/t.cc <<'CPP'
          #include <stdexcept>
          #include <vector>
          #include <string>
          int main() {
            static std::vector<std::string> v = {"a", "b"};
            try { throw std::length_error("x"); }
            catch (const std::logic_error &) { return (int)v.size() - 2; }
          }
          CPP
          echo '--- C++ link probe ---'
          set +e
          XNU_SDK_VERSION=16.5 xnu-deps/host/bin/xnu-clang++ \
            -arch arm64 -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" /tmp/t.cc -o /tmp/t.cc.bin \
            > /tmp/cc.log 2>&1
          rc=$?
          set -e
          echo "exit: $rc"
          sed -n '1,25p' /tmp/cc.log
          if [ $rc -ne 0 ]; then
            echo '--- what the wrapper resolves libc++ to ---'
            sed -n '1,20p' xnu-deps/host/bin/xnu-clang
            echo '--- do the stubs exist? ---'
            ls -l "$SDKROOT/usr/lib/libc++.tbd" "$SDKROOT/usr/lib/libz.tbd" 2>&1
            exit 1
          fi
          file /tmp/t.cc.bin | grep -q 'Mach-O' || { echo 'C++ output is not Mach-O'; exit 1; }
          echo "c++ linked: $(file -b /tmp/t.cc.bin)"

      - name: Fetch and patch mesa
        run: |
          # Same version, same checksum, same patches as tools/mk-mesa.sh, so a
          # build here is the build the kernel side expects.
          # This step failed once printing nothing at all, which says the first
          # command died rather than any check failing. Say where we are before
          # every step, so the next failure names itself.
          set -x
          echo "pwd=$(pwd)"
          echo "file: $(ls -l tools/mk-mesa.sh 2>&1)"
          echo "first VERSION line: $(grep -n '^VERSION=' tools/mk-mesa.sh 2>&1 | head -1)"
          set +e
          VERSION=$(sed -n 's/^VERSION=//p' tools/mk-mesa.sh 2>&1 | head -1)
          echo "VERSION rc=$? value=[$VERSION]"
          SHA256=$(sed -n 's/^SHA256=//p' tools/mk-mesa.sh 2>&1 | head -1)
          echo "SHA256 rc=$? len=${#SHA256}"
          set -e
          test -n "$VERSION" || { echo 'could not read VERSION from tools/mk-mesa.sh'; exit 1; }
          test -n "$SHA256"  || { echo 'could not read SHA256 from tools/mk-mesa.sh'; exit 1; }

          # archive.mesa3d.org serves this file but does not answer a GitHub
          # runner (curl exit 22). The tarball is kept as a release asset in this
          # repository instead, which the job token can always read, with the
          # sha256 below as the thing that actually decides whether it is right.
          URL="https://github.com/${{ github.repository }}/releases/download/mesa-sources/mesa-${VERSION}.tar.xz"
          echo "  from: $URL"
          rm -f mesa.tar.xz
          if ! curl -sSL --fail --retry 3 -o mesa.tar.xz "$URL"; then
            echo "could not download $URL"
            echo "the release asset is named mesa-$VERSION.tar.xz on the tag mesa-sources"
            exit 1
          fi
          echo "  got $(stat -c %s mesa.tar.xz) bytes"
          echo "$SHA256  mesa.tar.xz" | sha256sum -c --quiet || {
            echo "the tarball does not match the sha256 pinned in tools/mk-mesa.sh"
            echo "  expected $SHA256"
            echo "  actual   $(sha256sum mesa.tar.xz | cut -d' ' -f1)"
            exit 1
          }
          tar xJf mesa.tar.xz
          for p in tools/mesa/*.patch; do
            echo "  $(basename "$p")"
            patch -s --no-backup-if-mismatch -d "mesa-$VERSION" -p1 < "$p"
          done
          rm -rf "mesa-$VERSION/src/redwood-drm" "mesa-$VERSION/src/compiler/air"
          cp -r tools/mesa/redwood-drm "mesa-$VERSION/src/redwood-drm"
          cp -r tools/mesa/air "mesa-$VERSION/src/compiler/air"
          echo "  tree: $(du -sh mesa-$VERSION | cut -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          # meson comes from pip: there is no apt package by that name, which is
          # why the first Configure failed with "meson: command not found" after
          # everything before it had worked.
          python3 -m venv venv
          ./venv/bin/pip -q install --upgrade pip
          ./venv/bin/pip -q install meson ninja mako pyyaml packaging
          export PATH="$PWD/venv/bin:$PATH"
          hash -r
          echo "meson: $(command -v meson || echo MISSING) $(meson --version 2>/dev/null)"
          echo "ninja: $(command -v ninja || echo MISSING) $(ninja --version 2>/dev/null)"
          command -v meson >/dev/null || { echo 'meson is still not on PATH'; exit 1; }
          # meson wants to know the archiver by name, and `llvm-ar` is not what
          # the runner installs: its LLVM tools are versioned (llvm-ar-18). Resolve
          # each to an absolute path, which meson always accepts, and stop with the
          # names it looked for rather than "Unknown linker(s)".
          find_llvm() {
            for c in "$@"; do
              p=$(command -v "$c" 2>/dev/null) && { echo "$p"; return 0; }
            done
            return 1
          }
          LLVM_AR=$(find_llvm llvm-ar llvm-ar-18 llvm-ar-17 llvm-ar-19)     || { echo 'no llvm-ar; looked for llvm-ar(-18/-17/-19)'; exit 1; }
          LLVM_RANLIB=$(find_llvm llvm-ranlib llvm-ranlib-18 llvm-ranlib-17 llvm-ranlib-19) || { echo 'no llvm-ranlib'; exit 1; }
          LLVM_STRIP=$(find_llvm llvm-strip llvm-strip-18 llvm-strip-17 llvm-strip-19)  || { echo 'no llvm-strip'; exit 1; }
          echo "ar:     $LLVM_AR"
          echo "ranlib: $LLVM_RANLIB"
          echo "strip:  $LLVM_STRIP"

          cat > cross.ini <<INI
          [binaries]
          c = ['$PWD/xnu-deps/host/bin/xnu-clang', '-arch', 'arm64', '-isysroot', '$THEOS/sdks/iPhoneOS16.5.sdk']
          cpp = ['$PWD/xnu-deps/host/bin/xnu-clang++', '-arch', 'arm64', '-isysroot', '$THEOS/sdks/iPhoneOS16.5.sdk', '-fuse-cxa-atexit']
          objc = ['$PWD/xnu-deps/host/bin/xnu-clang', '-arch', 'arm64', '-isysroot', '$THEOS/sdks/iPhoneOS16.5.sdk']
          ar = '$LLVM_AR'
          ranlib = '$LLVM_RANLIB'
          strip = '$LLVM_STRIP'
          # A real pkg-config: this said 'false', so meson ran /usr/bin/false for
          # every lookup, warned "failed when ran", and gave up on libclc -- which
          # is installed and does ship a .pc file.
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          INI
          # libclc ships its .pc under the llvm version directory, which pkg-config
          # does not search by default.
          for d in /usr/lib/llvm-18/lib/pkgconfig /usr/lib/x86_64-linux-gnu/pkgconfig /usr/share/pkgconfig; do
            [ -d "$d" ] && export PKG_CONFIG_PATH="$d:${PKG_CONFIG_PATH:-}"
          done
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "--- can it see libclc? ---"
          pkg-config --exists libclc && echo "  libclc: $(pkg-config --modversion libclc)" \
            || { echo '  libclc not visible to pkg-config'; pkg-config --list-all 2>/dev/null | grep -i clc || true; }

          DRIVERS=softpipe,freedreno
          meson setup build mesa-$VERSION --cross-file cross.ini --wrap-mode=nofallback \
            --prefix=/redwood --libdir=lib --buildtype=release -Db_ndebug=true \
            -Dplatforms= -Dgallium-drivers="$DRIVERS" -Dfreedreno-kmds=msm -Dvulkan-drivers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dosmesa=true -Dllvm=disabled -Dgallium-opencl=disabled \
            -Dshared-glapi=enabled -Dgles1=disabled -Dgles2=enabled -Dopengl=true \
            -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dlibunwind=disabled -Dglvnd=disabled -Dvideo-codecs= -Dtools= -Dgallium-vdpau=disabled -Dgallium-va=disabled \
            -Dgallium-xa=disabled -Dlmsensors=disabled -Dbuild-tests=false

      - name: Build the GL library
        run: |
          export PATH="$PWD/venv/bin:$PATH"
          hash -r
          set +e
          ninja -C build > ninja.log 2>&1
          rc=$?
          set -e
          echo "ninja exit: $rc"
          if [ $rc -ne 0 ]; then
            echo '--- errors ---'
            grep -n -i 'error' ninja.log | head -50
            echo '--- tail ---'
            tail -40 ninja.log
            exit $rc
          fi
          tail -5 ninja.log

      - name: Build the compute library
        run: |
          export PATH="$PWD/venv/bin:$PATH"
          hash -r
          set +e
          ninja -C build src/gallium/drivers/freedreno/libredwoodair.dylib > air.log 2>&1
          rc=$?
          set -e
          echo "libredwoodair exit: $rc"
          if [ $rc -ne 0 ]; then
            echo '--- errors ---'
            grep -n -i 'error' air.log | head -40
            tail -30 air.log
          fi
          # Not fatal: the GL library is the deliverable and is enough to draw.
          # A report that says which of the two built is worth more than a job
          # that fails and says nothing.
          echo "AIR_RESULT=$rc" >> "$GITHUB_ENV"

      - name: Package
        run: |
          # The LLVM binutils are versioned on this image; resolve them once and use
          # the paths, which is what "llvm-strip: command not found" was about.
          resolve() { for c in "$@"; do command -v "$c" >/dev/null 2>&1 && { command -v "$c"; return 0; }; done; return 1; }
          STRIP=$(resolve llvm-strip llvm-strip-18 llvm-strip-17) || { echo 'no llvm-strip'; exit 1; }
          NM=$(resolve llvm-nm llvm-nm-18 llvm-nm-17)             || { echo 'no llvm-nm'; exit 1; }
          INSTALL_NAME=$(resolve llvm-install-name-tool install_name_tool llvm-install-name-tool-18) || { echo 'no install-name-tool'; exit 1; }
          echo "strip: $STRIP"; echo "nm: $NM"; echo "install-name-tool: $INSTALL_NAME"

          mkdir -p out
          OSMESA=$(find build -name 'libOSMesa*.dylib' | head -1)
          echo "built: $OSMESA ($(stat -c %s "$OSMESA") bytes)"
          "$STRIP" -x -o out/libOSMesa.8.dylib "$OSMESA"
          "$INSTALL_NAME" -id /redwood/lib/libOSMesa.8.dylib out/libOSMesa.8.dylib
          "$NM" -gU out/libOSMesa.8.dylib | awk '$3 ~ /^_gl/ { print substr($3, 2) }' > out/exported-gl.txt
          cp "mesa-$VERSION/src/mapi/glapi/registry/gl.xml" out/gl.xml
          cat tools/mesa/*.patch tools/mesa/redwood-drm/* | sha256sum > out/built-from
          echo "libOSMesa: $(stat -c %s out/libOSMesa.8.dylib) bytes, $(wc -l < out/exported-gl.txt) gl* functions"

          if [ "${AIR_RESULT:-1}" = 0 ]; then
            "$STRIP" -x -o out/libredwoodair.dylib build/src/gallium/drivers/freedreno/libredwoodair.dylib
            "$INSTALL_NAME" -id /redwood/lib/libredwoodair.dylib out/libredwoodair.dylib
            cat tools/mesa/air/* | sha256sum > out/built-from-air
            echo "libredwoodair: $(stat -c %s out/libredwoodair.dylib) bytes, $("$NM" -gU out/libredwoodair.dylib | grep -c ' _rwa_') rwa_* functions"
          else
            echo 'libredwoodair did not build; see the compute step in the log'
          fi
          ls -l out/

      - name: Record why OpenCL is not in this build
        run: |
          # clover is off, and the reason is worth printing rather than leaving in a
          # commit message: mesa resolves LLVM per module (bitwriter, executionengine,
          # ...), and Ubuntu's LLVM is a shared build whose llvm-config answers with
          # one library (-lLLVM-18). The lookup fails at meson.build:1793, not in our
          # code. Adreno 5xx can run a compute shader -- fd5_compute.c programs
          # SP_CS_CTRL_REG0 -- so this is a packaging problem to solve separately,
          # not a hardware limit.
          echo '=== llvm as this runner provides it ==='
          llvm-config --version 2>/dev/null || echo '  no llvm-config'
          llvm-config --shared-mode 2>/dev/null || true
          llvm-config --libs 2>/dev/null || true
          echo
          echo '=== what mesa asks for ==='
          echo '  bitwriter engine mcdisassembler mcjit core executionengine'
          echo '  scalaropts transformutils instcombine (+ clover: linker coverage'
          echo '  instrumentation ipo irreader lto option objcarcopts profiledata)'
          echo
          echo 'This build delivers libOSMesa.8.dylib: the GL ES implementation the'
          echo 'window server draws through. That is what a first GPU bring-up needs.'

      - name: The libraries must contain what the code looks up
        run: |
          # A library that links but exports no gl* functions is the failure worth
          # catching: eagl.c finds the entry points by name, so a short list means
          # the window server would find nothing to draw with.
          resolve() { for c in "$@"; do command -v "$c" >/dev/null 2>&1 && { command -v "$c"; return 0; }; done; return 1; }
          NM=$(resolve llvm-nm llvm-nm-18) || echo nm
          n=$(wc -l < out/exported-gl.txt)
          echo "gl* exports: $n"
          [ "$n" -gt 100 ] || { echo 'too few GL entry points'; exit 1; }
          grep -qx 'GetError' out/exported-gl.txt || { echo 'no glGetError in the exports'; exit 1; }
          if [ -f out/libredwoodair.dylib ]; then
            r=$("$NM" -gU out/libredwoodair.dylib | grep -c ' _rwa_')
            echo "rwa_* in libredwoodair: $r"
            [ "$r" -gt 0 ] || { echo 'no rwa_* symbols'; exit 1; }
          fi
          echo
          echo "built from: $(cat out/built-from)"

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-ios-libs
          path: |
            out/libOSMesa.8.dylib
            out/libredwoodair.dylib
            out/exported-gl.txt
            out/gl.xml
            out/built-from
            out/built-from-air
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-build-log
          path: |
            ninja.log
            air.log
            build/meson-logs/meson-log.txt
          if-no-files-found: ignore
