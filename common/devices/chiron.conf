# Xiaomi Mi MIX 2 (chiron) -- Qualcomm Snapdragon 835 (MSM8998), Adreno 540.
#
# Ported from redwood (POCO X5 Pro, SM7325). The boot chain, the GICv3 path, the
# timer, PSCI SMP, the display, APFS/ramfs and the return-to-loader path are
# generic and carry over unchanged. What is specific is listed in docs/PORTING.md;
# the values below come from the phone's own device tree (Android-chiron.dtb).
NAME="Xiaomi Mi MIX 2 (chiron)"
KIND=phone
SOC="Qualcomm Snapdragon 835 (MSM8998)"

UEFI_TARGET=chiron
UEFI_FD=                        # empty: Mu-Silicium/Build/chironPkg/... or prebuilt
DTB=                            # empty: the phone's own vendor_boot tree, or one given here
# 0x9FC00000/0x300000 is what cheeseburger and polaris use -- both msm8998, both
# running Mu-Silicium on real hardware -- so it is a measured value on this SoC
# rather than one derived here. It matches Resources/Configs/chiron.toml and
# Platforms/Xiaomi/chironPkg/chiron.fdf in sbccc1888/Mu-Silicium; if one moves, all
# three move together.
FD_BASE=0x9FC00000
FD_SIZE=0x300000
# 0xF0000000 + 0x4000000 stays inside chiron's main memory node
# (0x40000000 + 0xC0000000) and no reserved-memory carveout in the device tree
# covers it -- checked against all 233 reg pairs in Android-chiron.dtb. The loader
# has this same value compiled in (xnuloader/loader.c:18) and derives PANIC_LOG_BASE
# from it, so the two must move together.
PAYLOAD_BASE=0xF0000000

# The framebuffer address the UEFI reports. xnuloader picks struct platform by it.
# chiron's continuous-splash region, from the old port's devices.py: 0x9d400000.
FB_BASE=0x9D400000              # 1080 x 2160
WIFI_ATH11K=0                   # chiron is WCN3990, not WCN6750: keep off for now

# bootcpu=7 = the last big core (cpu@103); cpus=8 = all of them.
BOOTARGS="touchscreen=1 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# Taken from the phone's own Android with adb (README "On the phone").
# chiron's GPU is an Adreno 540 (a5xx): the firmware names differ from redwood's a660_*.
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"
